<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Infinitum</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<header class="site-header">
  <div class="container nav-row">
    <a href="index.html" class="brand"><span class="brand-dot"></span> Infinitum</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
    </nav>
    <div class="nav-actions"></div>
    <button class="nav-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
  </div>
</header>

<main class="auth-wrap">
  <div class="card auth-card">
    <h1 style="font-size:1.3rem; margin-bottom:18px;">Log in to Infinitum</h1>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <p class="muted hidden" id="login-error" style="color:var(--danger); font-size:0.85rem;"></p>
      <button type="submit" class="btn btn-primary" style="width:100%;" id="login-btn">Log in</button>
    </form>

    <p class="demo-note">Admin accounts and restaurant accounts are both created from the admin dashboard (or directly in Supabase) — there's no public sign-up page, by design.</p>
  </div>
</main>

<footer class="site-footer">
  <div class="container footer-bottom">
    <span>© <span data-year></span> Infinitum. All rights reserved.</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
  const form = document.getElementById("login-form");
  const errorEl = document.getElementById("login-error");
  const loginBtn = document.getElementById("login-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.classList.add("hidden");
    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in…";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { error } = await Auth.signIn(email, password);
    if (error) {
      errorEl.textContent = error.message || "Couldn't log in — check your email and password.";
      errorEl.classList.remove("hidden");
      loginBtn.disabled = false;
      loginBtn.textContent = "Log in";
      return;
    }

    const profile = await Auth.getProfile();
    if (!profile) {
      errorEl.textContent = "Your account isn't set up yet — ask an admin to finish setting up your profile.";
      errorEl.classList.remove("hidden");
      loginBtn.disabled = false;
      loginBtn.textContent = "Log in";
      return;
    }

    window.location.href = profile.role === "admin"
      ? "admin-dashboard.html"
      : `restaurant-dashboard.html?r=${profile.restaurant_id}`;
  });
</script>
</body>
</html>
