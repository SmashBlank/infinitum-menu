<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu — Infinitum</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<div class="menu-hero">
  <div class="container">
    <div class="preview-banner hidden" id="preview-banner">👁️ Preview mode — customers won't see this until you publish</div>
    <div class="logo-circle" id="logo-circle">
      <span class="muted" style="font-size:0.7rem;">Logo</span>
    </div>
    <h1 id="restaurant-name">Restaurant</h1>
    <p id="restaurant-tagline">Digital menu</p>
  </div>
</div>

<nav class="menu-nav" id="menu-nav"></nav>

<main id="menu-sections"></main>

<footer class="site-footer">
  <div class="container footer-bottom">
    <span>© <span data-year></span> Infinitum. All rights reserved.</span>
    <span>Powered by Infinitum</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/menuData.js"></script>
<script src="js/theme.js"></script>
<script src="js/main.js"></script>
<script>
(async function () {
  const params = new URLSearchParams(window.location.search);
  const restaurantId = params.get("r");
  const isPreview = params.get("preview") === "1";
  const restaurant = restaurantId ? await DataStore.getRestaurant(restaurantId) : null;

  if (!restaurant) {
    document.getElementById("menu-sections").innerHTML = "<p class='container'>Menu not found.</p>";
  } else {
    document.title = `${restaurant.name} — Menu`;
    document.getElementById("restaurant-name").textContent = restaurant.name;
    document.getElementById("restaurant-tagline").textContent = `Welcome! Here's what's on our menu today.`;

    if (isPreview) document.getElementById("preview-banner").classList.remove("hidden");

    // Apply the color theme derived from this restaurant's logo.
    const themeState = restaurant.theme || Theme.defaultState();
    Theme.applyVars(themeState.vars);

    if (restaurant.logo_url) {
      document.getElementById("logo-circle").innerHTML = `<img src="${restaurant.logo_url}" alt="${restaurant.name} logo">`;
    }

    const nav = document.getElementById("menu-nav");
    const sections = document.getElementById("menu-sections");
    // Preview mode (used from the editor) shows the working draft; the real
    // public URL only ever shows what's actually been published.
    const categories = isPreview ? await DataStore.getDraftMenu(restaurantId) : restaurant.published_menu;

    if (!categories || categories.length === 0) {
      nav.classList.add("hidden");
      sections.innerHTML = `
        <div class="container" style="padding:60px 0; text-align:center;">
          <h2 style="margin-bottom:8px;">${isPreview ? "Nothing to preview yet" : "Menu coming soon"}</h2>
          <p class="muted">${isPreview
            ? "Add a category and a few dishes in the editor to see a preview here."
            : "We're still setting up our digital menu — please check back shortly!"}</p>
        </div>
      `;
    } else {
      categories.forEach((cat, idx) => {
        const link = document.createElement("a");
        link.href = `#section-${cat.id}`;
        link.textContent = cat.name;
        if (idx === 0) link.classList.add("active");
        nav.appendChild(link);

        const section = document.createElement("section");
        section.className = "public-section";
        section.id = `section-${cat.id}`;
        section.innerHTML = `
          <div class="container">
            <h2 style="margin-bottom:20px;">${cat.name}</h2>
            <div class="public-card-grid">
              ${cat.items.map((item) => `
                <div class="card public-card">
                  <div class="img-wrap"><img src="${DataStore.resolvedImage(item)}" alt="${item.name}"></div>
                  <div class="card-body">
                    <h3 class="item-name">${item.name}</h3>
                    <div class="price-line">${DataStore.formatPrice(item)}</div>
                    <p class="item-desc">${DataStore.resolvedDescription(item)}</p>
                    <button type="button" class="expand-toggle hidden">
                      <span class="label">Show more</span><span class="arrow">⌄</span>
                    </button>
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
        `;
        sections.appendChild(section);
      });

      // For each tile, only show the "Show more" toggle if the name or
      // description actually got truncated/clamped — short items stay
      // exactly as tall as the image, with no extra UI clutter.
      document.querySelectorAll(".public-card").forEach((card) => {
        const name = card.querySelector(".item-name");
        const desc = card.querySelector(".item-desc");
        const toggle = card.querySelector(".expand-toggle");
        const isOverflowing = name.scrollWidth > name.clientWidth + 1 || desc.scrollHeight > desc.clientHeight + 1;
        if (!isOverflowing) return;
        toggle.classList.remove("hidden");
        toggle.addEventListener("click", () => {
          const expanded = card.classList.toggle("expanded");
          toggle.querySelector(".label").textContent = expanded ? "Show less" : "Show more";
        });
      });

      // Highlight the active nav link based on scroll position. The offset
      // matches the sticky nav's own height (plus a small buffer) so a
      // section is marked active as soon as it's actually the one visible
      // just below the nav bar, not only once it's scrolled far past it.
      const navLinks = Array.from(nav.querySelectorAll("a"));
      const sectionEls = categories.map((c) => document.getElementById(`section-${c.id}`));

      // Make sure clicking a category tab (or following any #section-… link)
      // doesn't park the category heading right behind the sticky nav bar —
      // reserve space above each section equal to the nav's real height.
      const scrollOffsetPx = nav.getBoundingClientRect().height + 12;
      sectionEls.forEach((el) => { el.style.scrollMarginTop = `${scrollOffsetPx}px`; });

      function updateActiveNavLink() {
        // If the user just clicked a tab, trust that choice for a moment —
        // a short final category can't always be scrolled far enough for
        // its heading to pass the offset check below (there's simply no
        // more page left to scroll), so position-based detection alone
        // would incorrectly snap back to the previous category.
        if (manualActiveIdx !== null && Date.now() < manualActiveUntil) {
          navLinks.forEach((l, i) => l.classList.toggle("active", i === manualActiveIdx));
          return;
        }
        const offset = nav.getBoundingClientRect().height + 16;
        let activeIdx = 0;
        sectionEls.forEach((el, i) => {
          if (el.getBoundingClientRect().top - offset <= 0) activeIdx = i;
        });
        navLinks.forEach((l, i) => l.classList.toggle("active", i === activeIdx));
      }
      let manualActiveIdx = null;
      let manualActiveUntil = 0;
      navLinks.forEach((link, i) => {
        link.addEventListener("click", () => {
          manualActiveIdx = i;
          manualActiveUntil = Date.now() + 700;
          navLinks.forEach((l, j) => l.classList.toggle("active", j === i));
        });
      });
      window.addEventListener("scroll", updateActiveNavLink);
      updateActiveNavLink();
    }
  }
})();
</script>
</body>
</html>
